name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install axios
      
      - name: Run health check
        run: node health-check.js
        env:
          AUTH_SERVICE_URL: ${{ secrets.AUTH_SERVICE_URL }}
          USERS_SERVICE_URL: ${{ secrets.USERS_SERVICE_URL }}
          CONTENT_SERVICE_URL: ${{ secrets.CONTENT_SERVICE_URL }}
          STORAGE_SERVICE_URL: ${{ secrets.STORAGE_SERVICE_URL }}
          NOTIFICATION_SERVICE_URL: ${{ secrets.NOTIFICATION_SERVICE_URL }}
